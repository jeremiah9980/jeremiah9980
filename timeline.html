<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Timeline · Day Flipbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0d1117; --bg-2:#141a23; --bg-3:#1b2330; --line:#2a3442;
    --ink:#e8e3d5; --ink-dim:#a8a092; --ink-faint:#6b6558;
    --amber:#e0a04a; --amber-glow:#f2c177; --rust:#c96442;
    --moss:#7a9b6e; --grid:rgba(224,160,74,0.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);
    font-family:"JetBrains Mono",ui-monospace,monospace;
    font-size:13px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:40px 40px;pointer-events:none;z-index:0}

  .app{display:grid;grid-template-rows:56px 1fr auto;height:100vh;
    position:relative;z-index:1}

  header{display:flex;align-items:center;justify-content:space-between;
    padding:0 22px;background:var(--bg-2);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:baseline;gap:14px}
  .brand h1{font-family:"Fraunces",Georgia,serif;font-weight:400;font-style:italic;
    font-size:22px;letter-spacing:-0.01em;color:var(--ink)}
  .brand h1 em{color:var(--amber);font-weight:500}
  .brand .meta{font-size:10px;text-transform:uppercase;letter-spacing:0.22em;
    color:var(--ink-faint)}
  .counter{font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:15px;
    color:var(--ink-dim)}
  .counter b{color:var(--amber-glow);font-feature-settings:"tnum";font-weight:500;
    font-style:normal;font-family:"JetBrains Mono",monospace}

  /* STAGE */
  .stage{position:relative;overflow:hidden;display:flex;align-items:center;
    justify-content:center;padding:32px 0 20px}

  /* Navigation arrows */
  .nav-arrow{position:absolute;top:50%;transform:translateY(-50%);
    width:56px;height:56px;border-radius:50%;background:var(--bg-2);
    border:1px solid var(--line);color:var(--ink);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all 180ms ease;z-index:10;
    font-family:"Fraunces",serif;font-size:26px;font-style:italic}
  .nav-arrow:hover{border-color:var(--amber);color:var(--amber-glow);
    background:var(--bg-3);transform:translateY(-50%) scale(1.06)}
  .nav-arrow.prev{left:24px}
  .nav-arrow.next{right:24px}
  .nav-arrow:disabled{opacity:0.25;cursor:not-allowed}
  .nav-arrow:disabled:hover{transform:translateY(-50%);background:var(--bg-2);
    color:var(--ink);border-color:var(--line)}

  /* Slide layout - caption + image side by side */
  .slide-wrap{display:flex;align-items:center;gap:48px;max-width:1200px;
    width:100%;padding:0 120px;height:100%}

  .caption{flex:1;max-width:360px;text-align:right;animation:fadeL 420ms ease both}
  @keyframes fadeL{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
  .caption .kicker{font-size:9px;text-transform:uppercase;letter-spacing:0.28em;
    color:var(--ink-faint);margin-bottom:10px}
  .caption .title{font-family:"Fraunces",Georgia,serif;font-weight:500;
    font-size:52px;letter-spacing:-0.025em;line-height:1;color:var(--ink);
    margin-bottom:12px;font-feature-settings:"ss01"}
  .caption .sub{font-family:"Fraunces",Georgia,serif;font-style:italic;
    font-weight:300;font-size:19px;color:var(--amber-glow);margin-bottom:22px;
    font-feature-settings:"tnum"}
  .caption .rule{height:1px;background:linear-gradient(-90deg,var(--amber),transparent);
    margin:0 0 18px auto;width:60%}
  .caption .date{font-size:10px;text-transform:uppercase;letter-spacing:0.25em;
    color:var(--ink-faint);font-feature-settings:"tnum"}

  .phone{position:relative;animation:fadeR 420ms ease both}
  @keyframes fadeR{from{opacity:0;transform:translateX(12px) scale(0.97)}to{opacity:1;transform:translateX(0) scale(1)}}
  .phone-frame{position:relative;padding:10px 10px 12px;border-radius:36px;
    background:linear-gradient(145deg,#2a3442,#1b2330);
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6),
      0 0 0 1px rgba(224,160,74,0.12),
      inset 0 1px 0 rgba(255,255,255,0.05)}
  .phone-frame::before{content:"";position:absolute;top:-6px;left:50%;
    transform:translateX(-50%);width:36%;height:3px;background:#0d1117;
    border-radius:0 0 6px 6px}
  .phone img{display:block;height:min(78vh,680px);width:auto;
    border-radius:26px;background:#000}

  /* FILMSTRIP */
  .strip{background:var(--bg-2);border-top:1px solid var(--line);
    padding:14px 22px;display:flex;align-items:center;gap:18px}
  .strip-label{font-size:9px;text-transform:uppercase;letter-spacing:0.24em;
    color:var(--ink-faint);flex-shrink:0;width:64px}
  .thumbs{display:flex;gap:10px;flex:1;overflow-x:auto;padding:4px 0}
  .thumb{position:relative;flex-shrink:0;cursor:pointer;
    border:1px solid var(--line);border-radius:4px;padding:4px;
    background:var(--bg-3);transition:all 160ms ease;
    display:flex;flex-direction:column;gap:4px;min-width:108px}
  .thumb img{width:100px;height:auto;border-radius:2px;display:block;opacity:0.55;
    transition:opacity 160ms ease}
  .thumb:hover{border-color:var(--ink-faint)}
  .thumb:hover img{opacity:0.85}
  .thumb.active{border-color:var(--amber);background:rgba(224,160,74,0.08);
    box-shadow:0 0 0 3px rgba(224,160,74,0.08)}
  .thumb.active img{opacity:1}
  .thumb .tl{font-size:9px;color:var(--ink-dim);padding:0 2px;line-height:1.3;
    font-feature-settings:"tnum"}
  .thumb.active .tl{color:var(--amber-glow)}

  .hint{flex-shrink:0;font-size:9px;color:var(--ink-faint);text-transform:uppercase;
    letter-spacing:0.18em}
  .hint kbd{background:var(--bg-3);border:1px solid var(--line);padding:2px 5px;
    border-radius:2px;color:var(--ink-dim);font-family:inherit;font-size:9px;
    margin:0 2px}

  ::-webkit-scrollbar{height:6px;width:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

  @media (max-width:900px){
    .slide-wrap{flex-direction:column;gap:18px;padding:10px 12px;
      justify-content:flex-start}
    .caption{text-align:center;max-width:none}
    .caption .title{font-size:30px}
    .caption .sub{font-size:14px;margin-bottom:10px}
    .caption .rule{margin:0 auto 12px}
    .phone img{height:min(56vh,480px)}
    .nav-arrow{width:44px;height:44px;font-size:22px}
    .nav-arrow.prev{left:8px}.nav-arrow.next{right:8px}
    .hint{display:none}
    .strip-label{display:none}
    .stage{padding:16px 0 12px}
  }
</style>
</head>

  <header>
    <div class="brand">
      <h1>Day <em>Flipbook</em></h1>
      <span class="meta">Timeline · Georgetown, TX</span>
    </div>
    <div class="counter">
      <b id="idx">1</b> / <b id="total">4</b>
    </div>

  <section class="stage">

    <div class="slide-wrap" id="slideWrap"></div>
    <button class="nav-arrow next" id="nextBtn" aria-label="Next day">→</button>
  </section>

  <div class="strip">
    <div class="strip-label">Days</div>
    <div class="thumbs" id="thumbs"></div>
    <div class="hint"><kbd>←</kbd><kbd>→</kbd> navigate</div>
  </div>
</div>

  const slideWrap = document.getElementById("slideWrap");
  const thumbsEl  = document.getElementById("thumbs");
  const prevBtn   = document.getElementById("prevBtn");
  const nextBtn   = document.getElementById("nextBtn");
  const idxEl     = document.getElementById("idx");
  const totalEl   = document.getElementById("total");
  totalEl.textContent = SLIDES.length;

  let i = SLIDES.length - 1; // start on most recent

  function render(){
    const s = SLIDES[i];
    slideWrap.innerHTML = `
      <div class="caption">
        <div class="kicker">Day ${i+1} of ${SLIDES.length}</div>
        <div class="title">${s.title}</div>
        <div class="sub">${s.sub}</div>
        <div class="rule"></div>
        <div class="date">${s.date}</div>
      </div>
      <div class="phone">
        <div class="phone-frame">
          <img src="${s.img}" alt="${s.title}" />
        </div>
      </div>
    `;
    idxEl.textContent = i + 1;
    prevBtn.disabled = i === 0;
    nextBtn.disabled = i === SLIDES.length - 1;

    // thumbnails
    [...thumbsEl.children].forEach((el, j) => {
      el.classList.toggle("active", j === i);
    });
    // scroll active thumb into view
    const active = thumbsEl.querySelector(".thumb.active");
    if (active) active.scrollIntoView({ behavior: "smooth", inline: "nearest", block: "nearest" });
  }

  // build thumbnails once
  SLIDES.forEach((s, j) => {
    const t = document.createElement("div");
    t.className = "thumb";
    t.innerHTML = `<img src="${s.img}" alt="${s.title}" /><div class="tl">${s.title}</div>`;
    t.addEventListener("click", () => { i = j; render(); });
    thumbsEl.appendChild(t);
  });

  prevBtn.addEventListener("click", () => { if (i > 0){ i--; render(); } });
  nextBtn.addEventListener("click", () => { if (i < SLIDES.length-1){ i++; render(); } });

  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft"  && i > 0)                  { i--; render(); }
    if (e.key === "ArrowRight" && i < SLIDES.length - 1)  { i++; render(); }
  });

  render();
</script>
